[package]
name = "swipe"
version = "0.1.6"
description = "画像スワイプ"
authors = ["you"]
edition = "2021"

[lib]
name = "swipe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
uuid = "1"
ble-peripheral-rust = { version = "0.2", optional = true }
local-ip-address = { version = "0.6", optional = true }
rouille = { version = "3", optional = true }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[features]
default = ["ble-peripheral-rust", "local-ip-address", "rouille"]
ble-peripheral-rust = ["dep:ble-peripheral-rust"]
local-ip-address = ["dep:local-ip-address"]
rouille = ["dep:rouille"]
