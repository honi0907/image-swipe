name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: swipe-release
          add-job-id-key: false

      - name: Install frontend dependencies
        run: npm ci

      - name: Sync docs/remote.html
        run: node scripts/sync-remote-docs.mjs

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --bundles nsis
          tagName: ${{ github.ref_name }}
          releaseName: "画像スワイプ ${{ github.ref_name }}"
          releaseBody: |
            ## 画像スワイプ ${{ github.ref_name }}
            - インストーラ: `image-swipe_*_x64-setup.exe`（NSIS）
            - アプリ起動時に新しいバージョンがあれば更新を案内します。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Attach remote.html for smartphones
        run: gh release upload "${{ github.ref_name }}" public/remote.html --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
