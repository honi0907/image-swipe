<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>image-swipe リモート</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        color: #f2f2f2;
        background: #121212;
      }
      body {
        margin: 0;
        padding: 1rem;
        max-width: 28rem;
        margin-inline: auto;
      }
      h1 {
        font-size: 1.15rem;
        font-weight: 600;
        margin: 0 0 0.75rem;
      }
      .status {
        font-size: 0.85rem;
        color: #aaa;
        margin-bottom: 1rem;
        line-height: 1.5;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }
      button {
        font: inherit;
        border: 1px solid #555;
        background: #2a2a2a;
        color: inherit;
        padding: 0.65rem 1rem;
        border-radius: 0;
        min-width: 3.5rem;
      }
      button:active {
        background: #444;
      }
      button.primary {
        flex: 1 1 100%;
        font-size: 1.1rem;
        padding: 1rem;
        border-color: #7ab;
        background: #1e3a4a;
      }
      button:disabled {
        opacity: 0.45;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0.5rem;
      }
      .hint {
        font-size: 0.8rem;
        color: #888;
        margin-top: 1.5rem;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <h1>image-swipe リモート</h1>
    <p class="status" id="status">準備中…</p>
    <div class="row">
      <button type="button" class="primary" id="connect">Bluetooth 接続</button>
      <button type="button" class="primary" id="next" disabled>次へ（Space 相当）</button>
    </div>
    <div class="grid" id="grid"></div>
    <p class="hint" id="hint"></p>
    <script>
      const SERVICE_UUID = "6e6f0001-7e82-4e5f-8e2e-0e8e8e8e8e8e";
      const CHAR_UUID = "6e6f0002-7e82-4e5f-8e2e-0e8e8e8e8e8e";
      const DEVICE_NAME_PREFIX = "image-swipe-remote";

      const isLocalLanPage =
        window.location.protocol === "http:" &&
        (window.location.port === "17342" || window.location.hostname === "localhost");

      if (isLocalLanPage && "serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
        const link = document.createElement("link");
        link.rel = "manifest";
        link.href = "/manifest.webmanifest";
        document.head.appendChild(link);
      }

      const statusEl = document.getElementById("status");
      const hintEl = document.getElementById("hint");
      const connectBtn = document.getElementById("connect");
      const nextBtn = document.getElementById("next");
      const grid = document.getElementById("grid");

      let bleChar = null;
      let httpReady = false;

      function cueBytes(kind, index) {
        if (kind === "next") return new Uint8Array([0x01]);
        const buf = new Uint8Array(3);
        buf[0] = kind === "goto" ? 0x02 : 0x03;
        buf[1] = index & 0xff;
        buf[2] = (index >> 8) & 0xff;
        return buf;
      }

      async function sendCue(kind, index) {
        const bytes = cueBytes(kind, index);
        if (bleChar) {
          await bleChar.writeValue(bytes);
          return;
        }
        if (!isLocalLanPage) {
          throw new Error("Bluetooth 未接続です");
        }
        const body =
          kind === "next"
            ? JSON.stringify({ kind: "next" })
            : JSON.stringify({ kind, index });
        const res = await fetch("/cue", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body,
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
      }

      function setStatus(msg) {
        statusEl.textContent = msg;
      }

      function setPlayEnabled(on) {
        nextBtn.disabled = !on;
        grid.querySelectorAll("button").forEach((el) => {
          el.disabled = !on;
        });
      }

      for (let i = 0; i < 24; i++) {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = String(i + 1);
        b.disabled = true;
        b.addEventListener("click", () => {
          sendCue("goto", i).catch((e) => setStatus("送出失敗: " + e.message));
        });
        grid.appendChild(b);
      }

      connectBtn.addEventListener("click", async () => {
        if (!navigator.bluetooth) {
          setStatus("このブラウザは Web Bluetooth 非対応です。");
          return;
        }
        try {
          setStatus("デバイスを選択…");
          const device = await navigator.bluetooth.requestDevice({
            filters: [{ namePrefix: DEVICE_NAME_PREFIX }],
            optionalServices: [SERVICE_UUID],
          });
          setStatus("接続中…");
          const server = await device.gatt.connect();
          const service = await server.getPrimaryService(SERVICE_UUID);
          bleChar = await service.getCharacteristic(CHAR_UUID);
          setStatus("BLE 接続済み（" + (device.name || DEVICE_NAME_PREFIX) + "）");
          setPlayEnabled(true);
          connectBtn.textContent = "Bluetooth 再接続";
        } catch (e) {
          setStatus("BLE: " + e.message);
          if (httpReady) {
            setPlayEnabled(true);
          }
        }
      });

      nextBtn.addEventListener("click", () => {
        sendCue("next").catch((e) => setStatus("送出失敗: " + e.message));
      });

      if (isLocalLanPage) {
        hintEl.innerHTML =
          "PC 内のローカル用ページです。<strong>同一 Wi‑Fi</strong> が取れないときは PC のリモートメニュー <strong>「スマホ用 QR」</strong>（HTTPS）を使ってください。";
        fetch("/info")
          .then((r) => (r.ok ? r.json() : null))
          .then((info) => {
            if (info && info.bleAdvertising) {
              setStatus("BLE 広告中。Bluetooth 接続または Wi‑Fi 送出が使えます。");
            } else if (info && info.bleError) {
              setStatus("BLE: " + info.bleError + " — Wi‑Fi 送出のみ試せます。");
            } else {
              setStatus("Wi‑Fi 送出または Bluetooth 接続で操作できます。");
            }
            httpReady = true;
            if (!bleChar) {
              setPlayEnabled(true);
            }
          })
          .catch(() => {
            setStatus("同一 Wi‑Fi 経由の送出は使えません。スマホ用 HTTPS QR + Bluetooth を試してください。");
          });
      } else {
        hintEl.innerHTML =
          "モバイル回線または Wi‑Fi で表示できます（<strong>同一 Wi‑Fi は不要</strong>）。PC の Bluetooth を ON にして <strong>Bluetooth 接続</strong> を押してください。";
        setStatus("Bluetooth 接続後に操作できます（PC に近づけてください）");
      }
    </script>
  </body>
</html>
